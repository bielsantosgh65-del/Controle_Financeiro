function feriados(y){

 ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].forEach(d=>s[y+'-'+d]='Feriado nacional');
 s[addDays(p,-48)]='Carnaval';s[addDays(p,-47)]='Carnaval';s[addDays(p,-2)]='Sexta-feira Santa';s[addDays(p,60)]='Corpus Christi';
 return HOL[y]=s;

function refFatura(cid,data){

  Object.assign(f,datasFatura(c,f.ref));
  f.st=(f.total>0&&f.saldo<=0.004)||(f.total===0&&f.pago>0)?'paga':(t>f.venc?'vencida':(t>=f.fecha?'fechada':(f.ref===refFatura(cid,t)?'aberta':'futura')));
  f.cashback=sum(f.pags,p=>+p.cashback||0);f.pontos=f.pags.reduce((s,p)=>s+(+p.pontos||0),0);
  f.cbPrev=c.cashback>0?r2(f.saldo*c.cashback/100):0;
  f.cartao=cid;return f;}).sort((a,b)=>a.ref.localeCompare(b.ref));
}

/* saldoIni = saldo no início do dia saldoEm; movimentos a partir dessa data alteram o saldo */
function saldoConta(cid,ate){

 const ok=d=>d>=base&&(!ate||d<=ate);

function mediaVariavel(n){const ks=monthRange(addYM(curYM(),-n),addYM(curYM(),-1));const L=D.lanc.filter(l=>l.tipo==='D'&&(l.nat||'variavel')==='variavel'&&!l.informada&&l.forma!=='vr'&&ks.includes(l.comp));const meses=new Set(L.map(l=>l.comp)).size;return meses?r2(sum(L,l=>l.valor)/n):0;}
function projecao(n){
 n=n||6;const cur=curYM();const mk=monthRange(cur,addYM(cur,n-1));const t=today();
 const med=mediaVariavel(3);let saldo=saldoTotal(t);const out=[];
 mk.forEach((k,i)=>{
  let ent=0,sai=0,fat=0,est=0,rateio=0;
  const mes=d=>{let m=ym(d);if(m<cur)m=cur;return m;};
  D.lanc.forEach(l=>{
   (l.rateio||[]).forEach(x=>{if(x.st!=='recebido'&&!isVR(x.conta)&&mes(x.data)===k)rateio+=x.valor;});
   if(l.tipo==='T'||isCred(l)||l.status==='pago')return;
   if(isVR(l.conta))return;
   if(mes(l.data)!==k)return;
   if(l.tipo==='R')ent+=l.valor;else sai+=l.valor;});
  D.cartoes.forEach(c=>faturas(c.id).forEach(f=>{if(f.saldo>0&&mes(f.venc)===k)fat+=f.saldo;}));
  D.rec.forEach(r=>{if(r.ativo===false||r.tipo==='T'||(r.skip||[]).includes(k))return;if(r.forma==='vr'||isVR(r.conta))return;
   compsRec(r,addYM(k,6)).forEach(c=>{if(ym(dataRec(r,c))!==k)return;if(D.lanc.some(l=>l.recId===r.id&&l.comp===c))return;
    if(r.tipo==='R')ent+=r.valor;else{sai+=r.valor;(r.rateio||[]).forEach(x=>{if(!isVR(x.conta))rateio+=x.valor;});}});});
  if(i===0){const gasto=sum(D.lanc.filter(l=>l.tipo==='D'&&(l.nat||'variavel')==='variavel'&&!l.informada&&l.forma!=='vr'&&l.comp===k),l=>l.valor);est=Math.max(0,med-gasto);}else est=med;

  out.push({k,ent,rateio:r2(rateio),sai:r2(sai),fat:r2(fat),est:r2(est),saidas,saldo});
 });
 return {meses:out,media:med};
}

 const est=D.lanc.filter(l=>l.estimado&&l.comp<=cur&&stEf(l)!=='pago');

/* ===================== Gráficos SVG ===================== */
function niceMax(m){if(m<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function shortBRL(v){const a=Math.abs(v),s=v<0?'-':'';if(a>=1000)return s+'R$ '+nf(a/1000,a>=10000?0:1)+' mil';return s+'R$ '+nf(a,0);}
function donut(items,center,act){
 const tot=items.reduce((s,x)=>s+x.v,0);const R=80,r=52,C=90;let a=-Math.PI/2,g='';
 if(tot<=0)g='<circle cx="90" cy="90" r="66" fill="none" stroke="var(--surface2)" stroke-width="28"/>';
 items.forEach(x=>{if(x.v<=0)return;const f=x.v/tot;const a2=a+f*Math.PI*2-(f>=1?0.0001:0);const lg=f>.5?1:0;
  const p=(rr,an)=>(C+rr*Math.cos(an)).toFixed(2)+' '+(C+rr*Math.sin(an)).toFixed(2);
  g+='<path '+(act?'data-act="'+act+'" data-v="'+esc(x.id)+'" ':'')+'d="M'+p(R,a)+' A'+R+' '+R+' 0 '+lg+' 1 '+p(R,a2)+' L'+p(r,a2)+' A'+r+' '+r+' 0 '+lg+' 0 '+p(r,a)+' Z" fill="'+x.cor+'"><title>'+esc(x.nome+': '+brl(x.v)+' ('+nf(f*100)+'%)')+'</title></path>';a=a2;});
 g+='<text class="ctr" x="90" y="92" text-anchor="middle">'+esc(center||'')+'</text><text x="90" y="110" text-anchor="middle">total</text>';
 return '<svg class="chart" viewBox="0 0 180 180" role="img" aria-label="Distribuição">'+g+'</svg>';
}
function donutBlock(items,act,empty){
 const tot=items.reduce((s,x)=>s+x.v,0);if(tot<=0)return '<div class="empty small">'+(empty||'Sem valores no período.')+'</div>';
 return '<div class="donut-wrap">'+donut(items,shortBRL(tot),act)+'<div class="donut-leg">'+items.map(x=>'<button type="button" data-act="'+act+'" data-v="'+esc(x.id)+'"><span class="cat"><span class="dot" style="background:'+esc(x.cor)+'"></span>'+esc(x.nome)+'</span><span>'+brl(x.v)+' · '+nf(x.v/tot*100,0)+'%</span></button>').join('')+'</div></div>';

/* barras agrupadas: cols=[{label,key,vals:[{v,cor,nome}]}] */
function groupBars(cols,opts){
 opts=opts||{};const W=680,H=240,L=62,R=8,T=14,B=30,iw=W-L-R,ih=H-T-B;
 let mx=0,mn=0;cols.forEach(c=>c.vals.forEach(x=>{mx=Math.max(mx,x.v);mn=Math.min(mn,x.v);}));
 const max=niceMax(mx);const n=cols.length||1;const per=cols[0]?cols[0].vals.length:1;const gw=iw/n*0.72;const bw=Math.min(22,gw/per);
 const Y=v=>T+ih-ih*v/max;let g='';
 for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+shortBRL(v)+'</text>';}
 cols.forEach((c,i)=>{const cx=L+iw*(i+.5)/n;const x0=cx-bw*per/2;
  c.vals.forEach((x,j)=>{if(x.v<=0)return;const y=Y(x.v);g+='<rect '+(opts.act?'data-act="'+opts.act+'" data-v="'+c.key+'" ':'')+'x="'+(x0+j*bw+1)+'" y="'+y+'" width="'+(bw-2)+'" height="'+Math.max(T+ih-y,.5)+'" fill="'+x.cor+'" rx="2"><title>'+esc(c.label+' · '+x.nome+': '+brl(x.v))+'</title></rect>';});
  g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle"'+(c.bold?' style="font-weight:700;fill:var(--fg)"':'')+'>'+esc(c.label)+'</text>';});
 if(opts.line){const pts=opts.line;const lmx=Math.max(max,...pts.map(p=>p.v));const lmn=Math.min(0,...pts.map(p=>p.v));const YL=v=>T+ih-ih*(v-lmn)/(niceMax(lmx)-lmn||1);
  const d=pts.map((p,i)=>(i?'L':'M')+(L+iw*(i+.5)/n).toFixed(1)+' '+YL(p.v).toFixed(1)).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4"/>';
  pts.forEach((p,i)=>{g+='<circle cx="'+(L+iw*(i+.5)/n)+'" cy="'+YL(p.v)+'" r="4" fill="'+(p.v<0?'var(--danger)':'var(--fg)')+'"><title>'+esc('Saldo projetado '+p.label+': '+brl(p.v))+'</title></circle><text x="'+(L+iw*(i+.5)/n)+'" y="'+(YL(p.v)-9)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+shortBRL(p.v)+'</text>';});}
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'Gráfico de barras')+'">'+g+'</svg>';
}
function lineChart(pts,fmt,fmtT){fmt=fmt||shortBRL;fmtT=fmtT||brl;
 const W=680,H=210,L=62,R=12,T=14,B=28,iw=W-L-R,ih=H-T-B;if(pts.length<2)return '<div class="empty small">Dados insuficientes.</div>';
 const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);const span=(mx-mn)||Math.abs(mx)||1000;mn=mn-span*.1;mx=mx+span*.1;
 const X=i=>L+iw*i/(pts.length-1),Y=v=>T+ih-(v-mn)/(mx-mn)*ih;let g='';
 for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(v)+'</text>';}
 const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 g+='<path d="'+d+' L'+X(pts.length-1)+' '+(T+ih)+' L'+L+' '+(T+ih)+' Z" fill="var(--primary)" opacity=".10"/><path d="'+d+'" fill="none" stroke="var(--primary)" stroke-width="2.5"/>';
 pts.forEach((p,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(i===pts.length-1?5:3)+'" fill="var(--primary)"><title>'+esc(p.label+': '+fmtT(p.v))+'</title></circle>';if(pts.length<=13||i%Math.ceil(pts.length/12)===0)g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do saldo">'+g+'</svg>';

/* ---------- Calendário ---------- */
function eventosDia(){
 const ev={};const add=(d,e)=>(ev[d]=ev[d]||[]).push(e);
 D.lanc.forEach(l=>{if(isCred(l)||l.tipo==='T')return;const s=stEf(l);add(l.data,{t:l.desc,v:l.valor,cls:s==='pago'?l.tipo+' P':s==='vencido'?'V':l.tipo,l,s});});
 D.lanc.forEach(l=>(l.rateio||[]).forEach(x=>{if(x.modo==='abat')return;add(x.data,{t:'Receber: '+x.pessoa,v:x.valor,cls:x.st==='recebido'?'R P':rtSt(x)==='atrasado'?'V':'R',rt:x,l});}));
 D.cartoes.forEach(c=>faturas(c.id).forEach(f=>{if(f.total<=0)return;add(f.venc,{t:'Fatura '+c.nome,v:f.saldo||f.total,cls:f.st==='paga'?'F P':f.st==='vencida'?'V':'F',fat:f,c});}));
 return ev;
}

 form.addEventListener('input',e=>o.onInput&&o.onInput(form,e));form.addEventListener('change',e=>o.onInput&&o.onInput(form,e));

}

function rtRead(v,tpl,old,defData){
 const out=[];Object.keys(v).filter(k=>k.startsWith('rt_p_')).forEach(k=>{const i=k.slice(5);const p=(v['rt_p_'+i]||'').trim();const val=r2(parseNum(v['rt_v_'+i]));if(!p||!(val>0))return;
  const o={id:v['rt_id_'+i]||('x'+uid()),pessoa:p,valor:val,modo:v['rt_m_'+i],conta:v['rt_c_'+i]};
  if(tpl)o.dia=Math.min(31,Math.max(1,parseInt(v['rt_d_'+i])||20));
  else{o.data=v['rt_d_'+i]||defData;const ol=(old||[]).find(x=>x.id===o.id);o.st=ol?ol.st:'pendente';if(ol&&ol.recEm)o.recEm=ol.recEm;}
  out.push(o);});
 return out;
}

/* ===================== Persistência (banco do artefato, com cópia local de reserva) ===================== */
let MODE='loading',db=null,loaded=false,statusMsg='';
const LAST={};const wq=new Map();let working=false;
const ORD=['cats','contas','cartoes'];
function docsOf(col){return col==='cfg'?[Object.assign({},D.cfg,{id:'geral'})]:D[col];}
function persist(){
 if(MODE==='local'){try{localStorage.setItem(LS_KEY,JSON.stringify(D));}catch(e){toast('O navegador bloqueou o armazenamento local. Exporte um backup.','err');}return;}
 if(MODE!=='cloud'||!loaded)return;
 ['cfg'].concat(COLS).forEach(col=>{const prev=LAST[col]||{};const now={};docsOf(col).forEach(o=>{const j=JSON.stringify(o);now[o.id]=j;if(prev[o.id]!==j)queueWrite(col,o.id,JSON.parse(j));});Object.keys(prev).forEach(id=>{if(!(id in now))queueWrite(col,id,null);});LAST[col]=now;});
}
function commit(){gerarObrigacoes();persist();schedule();}
function queueWrite(col,id,obj){const k=col+'|'+id;wq.delete(k);wq.set(k,{col,id,obj});pump();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pump(){
 if(working)return;working=true;
 while(wq.size){const [k,v]=wq.entries().next().value;wq.delete(k);savingUI();
  const ref=db.collection(v.col).doc(v.id);const run=()=>v.obj?ref.set(v.obj):ref.delete();
  try{await run();}catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await run();}catch(e2){writeFail(e2);}}else writeFail(e);}}
 working=false;savingUI();
}
function writeFail(e){const c=e&&e.code;
 if(c==='invalid_argument')toast('Sem permissão para salvar ou dado inválido: '+((e&&e.message)||''),'err');
 else if(c==='quota_exceeded')toast('Limite de armazenamento atingido. Exporte um backup e exclua lançamentos antigos.','err');
 else if(c==='resource_exhausted')toast('Muitas gravações seguidas. Aguarde alguns segundos.','err');
 else toast('Não foi possível salvar: '+((e&&e.message)||'erro desconhecido'),'err');}
function savingUI(){const el=document.getElementById('saving');if(!el)return;const n=wq.size+(working?1:0);el.textContent=MODE==='cloud'?(n?'Salvando… ('+n+')':'Tudo salvo'):'';}
function startCloud(){
 const all=['cfg'].concat(COLS);const pend=new Set(all);
 const timer=setTimeout(()=>{if(pend.size){statusMsg='Os dados ainda não carregaram. Verifique a conexão; a página atualiza sozinha quando o banco responder.';schedule();}},10000);
 all.forEach(col=>{
  db.collection(col).onSnapshot(snap=>{
   const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign(clone(d.data()),{id:d.id});});
   const base={};Object.keys(m).forEach(id=>base[id]=JSON.stringify(m[id]));
   wq.forEach(v=>{if(v.col===col){if(v.obj)m[v.id]=v.obj;else delete m[v.id];}});
   if(col==='cfg'){const g=m.geral;D.cfg=Object.assign(clone(DEF_CFG),g||{});D.cfg.moto=Object.assign(clone(DEF_CFG.moto),(g&&g.moto)||{});delete D.cfg.id;LAST.cfg={geral:JSON.stringify(Object.assign({},D.cfg,{id:'geral'}))};if(g)LAST.cfg.geral=JSON.stringify(Object.assign({},D.cfg,{id:'geral'}));}
   else{let arr=Object.values(m);if(ORD.includes(col))arr.sort((a,b)=>(a.ord||99)-(b.ord||99)||String(a.nome).localeCompare(String(b.nome)));D[col]=arr;LAST[col]={};arr.forEach(o=>LAST[col][o.id]=base[o.id]||JSON.stringify(o));}
   invalidate();
   if(!snap.metadata.fromCache&&pend.has(col)){pend.delete(col);if(!pend.size){clearTimeout(timer);statusMsg='';loaded=true;gerarObrigacoes();persist();}}
   schedule();
  },err=>{pend.delete(col);statusMsg='Falha ao sincronizar ('+col+'): '+((err&&err.message)||(err&&err.code))+'. Recarregue a página.';if(!pend.size){clearTimeout(timer);loaded=true;}schedule();});
 });
}

async function init(){
 D=emptyData();if(!F.per)F.per=curYM();render();
 const framed=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
 let C=null;for(let i=0;i<(framed?40:1);i++){if(window.claude&&typeof window.claude.use==='function'){C=window.claude;break;}await sleep(100);}
 if(C){try{db=await Promise.race([C.use('db'),sleep(10000).then(()=>null)]);}catch(e){db=null;}
  try{downloads=await Promise.race([C.use('downloads'),sleep(4000).then(()=>null)]);}catch(e){downloads=null;}}
 if(db){MODE='cloud';startCloud();}
 else{MODE='local';try{const t=localStorage.getItem(LS_KEY);if(t){const o=JSON.parse(t);if(o&&o.lanc){D=Object.assign(emptyData(),o);D.cfg=Object.assign(clone(DEF_CFG),o.cfg||{});}}}catch(e){}
  if(C)statusMsg='O banco de dados do artefato não respondeu. Os dados estão sendo salvos só neste navegador; recarregue para tentar sincronizar.';
  loaded=true;commit();}
}
